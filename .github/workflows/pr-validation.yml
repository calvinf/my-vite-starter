name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install

      - name: Lint and format
        run: hk check --all

      - name: Build
        run: bun run build

      - name: Tests
        run: bun test
