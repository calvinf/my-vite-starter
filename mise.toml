[tools]
bun = "1.4.0"
node = "24.19.0"
hk = "1.56.0"

[env]
HK_MISE = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Run project linters and formatters via hk"
run = "hk check --all"

[tasks.fix]
description = "Auto-fix project linters and formatters via hk"
run = "hk fix --all"
